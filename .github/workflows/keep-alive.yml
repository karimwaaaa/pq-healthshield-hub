# ============================================================
# Keeps the Supabase free-tier project from auto-pausing after 7 days
# of no API activity, by hitting it once a day.
#
# WHERE THIS GOES: save this file as
#   .github/workflows/keep-alive.yml
# inside a GitHub repository. It does NOT need to be the same repo as
# your Netlify site — any repo you own works, even an empty throwaway one.
#
# BEFORE THIS WORKS, add two repo secrets:
#   Repo → Settings → Secrets and variables → Actions → New repository secret
#     SUPABASE_URL        = https://YOUR-PROJECT-REF.supabase.co
#     SUPABASE_ANON_KEY    = <your anon/public key from Supabase project settings>
# ============================================================

name: Keep Supabase Awake

on:
  schedule:
    # Runs once a day. GitHub Actions cron is UTC and can drift by a few
    # minutes at busy times — that's fine, it just needs to run daily.
    - cron: '17 3 * * *'
  workflow_dispatch: {}   # lets you click "Run workflow" manually to test it

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        run: |
          curl -sS -o /dev/null -w "Supabase ping returned HTTP %{http_code}\n" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/clients?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
